services:
  mongodb:
    image: mongo:8
    ports: ["27017:27017"]
    volumes: [mongodb_data:/data/db]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  ai:
    build:
      context: ../ai-service
    ports: ["8000:8000"]
  api:
    build:
      context: ../server
    environment:
      SERVER_PORT: 4000
      AI_SERVICE_URL: http://ai:8000
      MONGODB_URI: mongodb://mongodb:27017/trustsphere
      REDIS_URL: redis://redis:6379
    ports: ["4000:4000"]
    depends_on: [mongodb, redis, ai]
volumes:
  mongodb_data:
